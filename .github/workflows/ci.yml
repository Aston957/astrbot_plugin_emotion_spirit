name: CI

# Trigger: every push to main + every pull request to main
# Purpose: run the full test suite across Python 3.11/3.13 AND
#          AstrBot 4.9.2 / 4.14.6 / 4.25.5 (R1 from ECOSYSTEM_EVAL_2026-06-13).
# This is the PR-time test gate for quality assurance.
# The AstrBot matrix is the **breaking-change early warning**: if AstrBot
# upstream changes command/handler/persistence semantics, we want CI red
# BEFORE the user installs a new AstrBot and finds emotion_spirit broken.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read  # read-only access for checkout

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }} × AstrBot ${{ matrix.astrbot-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # run all matrix combos even if one fails
      matrix:
        python-version: ['3.11', '3.13']
        astrbot-version: ['4.9.2', '4.14.6', '4.25.5']
        # AstrBot 4.25.5 requires Python >=3.12 → skip the 3.11 + 4.25.5 combo
        exclude:
          - python-version: '3.11'
            astrbot-version: '4.25.5'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history (KB regen scripts may need it)

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # AstrBot 4.9.2 / 4.14.6 are on PyPI; 4.25.5 is GitHub-only.
      # Pin the install source per matrix entry.
      - name: Install AstrBot ${{ matrix.astrbot-version }}
        run: |
          python -m pip install --upgrade pip
          if [[ "${{ matrix.astrbot-version }}" == "4.25.5" ]]; then
            # AstrBotDevs org renamed in 2026 — PyPI only has up to 4.14.6
            pip install "astrbot @ git+https://github.com/AstrBotDevs/AstrBot@v${{ matrix.astrbot-version }}"
          else
            pip install "astrbot==${{ matrix.astrbot-version }}"
          fi

      - name: Install package + dev dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest --tb=short

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-py${{ matrix.python-version }}-astrbot${{ matrix.astrbot-version }}
          path: |
            .pytest_cache/
            **/test-*.xml
          if-no-files-found: ignore
          retention-days: 7

  wheel-install-smoke:
    # Bug-A (v1.2.10) regression gate. CI 的 test job 用 `pip install -e` (editable)
    # 跑测试, KB JSON 永远在源码树里 → 永远碰不到 wheel packaging 缺失.
    # 本 job 用非 editable `pip install .` (build wheel → site-packages) 验证
    # KB JSON 等数据文件真的进了 wheel. v1.2.9 fresh-install FileNotFoundError 的根因.
    name: Wheel install smoke (Bug-A regression)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: pip install . (non-editable, builds wheel)
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Verify KB JSON packaged in wheel
        run: |
          python -c "from emotion_spirit.core.persona_labels_db import get_silence_tendency_weights, get_defense_deltas; assert get_silence_tendency_weights(), 'silence_tendency_weights.json missing from wheel (Bug-A)'; assert get_defense_deltas(), 'defense_deltas.json missing from wheel (Bug-A)'; print('KB JSON packaged OK')"
