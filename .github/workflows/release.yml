name: Build Release Zip

# 触发: 推送 v* 标签 (如 v2.0.0v1) → 自动 build slim zip → attach 到 GitHub Release
# 配合 .gitattributes 的 export-ignore, 16.7 MB 全量仓库缩水到 ~250 KB 用户包

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # 创建 Release 需要写权限

jobs:
  build-release:
    name: Build & Attach Release Zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git archive 需要完整历史

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"        # refs/tags/v2.0.0v1 → v2.0.0v1
          VERSION="${TAG#v}"                    # v2.0.0v1 → 2.0.0v1
          ZIP_NAME="astrbot-plugin-emotion-spirit-${VERSION}.zip"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_OUTPUT
          echo "Tag: ${TAG}"
          echo "Version: ${VERSION}"
          echo "Zip: ${ZIP_NAME}"

      - name: Build release zip via git archive
        run: |
          # --prefix=astrbot_plugin_emotion_spirit/ → zip 内顶层是 astrbot_plugin_emotion_spirit/ 文件夹
          # --format=zip → 直接生成 zip
          # export-ignore 规则由 .gitattributes 提供
          git archive \
            --prefix=astrbot_plugin_emotion_spirit/ \
            --format=zip \
            -o "${{ steps.version.outputs.ZIP_NAME }}" \
            HEAD
          echo "---"
          echo "Zip size:"
          ls -lh "${{ steps.version.outputs.ZIP_NAME }}"

      - name: Verify zip contents
        run: |
          echo "=== Top-level entries (should start with astrbot_plugin_emotion_spirit/) ==="
          unzip -l "${{ steps.version.outputs.ZIP_NAME }}" | head -10
          echo "..."
          echo ""
          echo "=== Total file count ==="
          unzip -l "${{ steps.version.outputs.ZIP_NAME }}" | tail -1
          echo ""
          echo "=== Sanity checks ==="
          # 必须包含的文件
          unzip -l "${{ steps.version.outputs.ZIP_NAME }}" | grep -q "astrbot_plugin_emotion_spirit/main.py" && echo "  ✓ main.py present" || (echo "  ✗ main.py MISSING" && exit 1)
          unzip -l "${{ steps.version.outputs.ZIP_NAME }}" | grep -q "astrbot_plugin_emotion_spirit/metadata.yaml" && echo "  ✓ metadata.yaml present" || (echo "  ✗ metadata.yaml MISSING" && exit 1)
          unzip -l "${{ steps.version.outputs.ZIP_NAME }}" | grep -q "astrbot_plugin_emotion_spirit/emotion_spirit/__init__.py" && echo "  ✓ emotion_spirit package present" || (echo "  ✗ emotion_spirit package MISSING" && exit 1)
          unzip -l "${{ steps.version.outputs.ZIP_NAME }}" | grep -q "astrbot_plugin_emotion_spirit/data/cmd_config.json" && echo "  ✓ data/cmd_config.json present" || (echo "  ✗ data/cmd_config.json MISSING" && exit 1)
          # 不应包含的文件
          unzip -l "${{ steps.version.outputs.ZIP_NAME }}" | grep -q "astrbot_plugin_emotion_spirit/tests/" && (echo "  ✗ tests/ should be excluded" && exit 1) || echo "  ✓ tests/ excluded"
          unzip -l "${{ steps.version.outputs.ZIP_NAME }}" | grep -q "astrbot_plugin_emotion_spirit/verification/" && (echo "  ✗ verification/ should be excluded" && exit 1) || echo "  ✓ verification/ excluded"
          unzip -l "${{ steps.version.outputs.ZIP_NAME }}" | grep -q "astrbot_plugin_emotion_spirit/tools/" && (echo "  ✗ tools/ should be excluded" && exit 1) || echo "  ✓ tools/ excluded"
          unzip -l "${{ steps.version.outputs.ZIP_NAME }}" | grep -q "astrbot_plugin_emotion_spirit/docs/" && (echo "  ✗ docs/ should be excluded" && exit 1) || echo "  ✓ docs/ excluded"
          unzip -l "${{ steps.version.outputs.ZIP_NAME }}" | grep -q "narrative_backtest" && (echo "  ✗ narrative_backtest JSON should be excluded" && exit 1) || echo "  ✓ narrative_backtest JSON excluded"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.ZIP_NAME }}
          files: ${{ steps.version.outputs.ZIP_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
