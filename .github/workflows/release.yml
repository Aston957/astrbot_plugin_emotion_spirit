name: Build Release Zip

# 触发: 推送 v* 标签 (如 v1.0.0) → 自动 build slim zip → attach 到 GitHub Release
# 配合 .gitattributes 的 export-ignore, 16.7 MB 全量仓库缩水到 ~250 KB 用户包

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # 创建 Release 需要写权限

jobs:
  build-release:
    name: Build & Attach Release Zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git archive 需要完整历史

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"        # refs/tags/v1.0.0 → v1.0.0
          VERSION="${TAG#v}"                    # v1.0.0 → 1.0.0
          ZIP_NAME="astrbot-plugin-emotion-spirit-${VERSION}.zip"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_OUTPUT
          echo "Tag: ${TAG}"
          echo "Version: ${VERSION}"
          echo "Zip: ${ZIP_NAME}"

      - name: Verify version consistency (tag == metadata.yaml == _version.py)
        run: |
          # Tag version (refs/tags/v1.0.0 -> 1.0.0). Allow -rc.N / -beta.N / -alpha.N suffix.
          TAG="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG#v}"
          TAG_BASE=$(echo "${TAG_VERSION}" | sed -E 's/-(rc|beta|alpha)\.[0-9]+$//')

          # metadata.yaml version
          META_VERSION=$(grep '^version:' metadata.yaml | sed -E 's/^version:[[:space:]]*"([^"]+)".*/\1/')

          # _version.py version (PEP 440, may have .postN suffix)
          PY_VERSION=$(grep -E '^__version__[[:space:]]*=' emotion_spirit/_version.py | sed -E 's/^__version__[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          PY_BASE=$(echo "${PY_VERSION}" | sed -E 's/\.post[0-9]+$//')

          echo "Tag:           ${TAG_VERSION} (base: ${TAG_BASE})"
          echo "metadata.yaml: ${META_VERSION}"
          echo "_version.py:   ${PY_VERSION} (base: ${PY_BASE})"
          echo ""

          # 三源 "base version" 必须一致 (允许 tag 额外带 rc/beta/alpha 后缀)
          if [ "${TAG_BASE}" != "${META_VERSION}" ]; then
            echo "::error file=metadata.yaml::version '${META_VERSION}' does not match git tag base '${TAG_BASE}' (tag='${TAG_VERSION}')"
            exit 1
          fi

          if [ "${TAG_BASE}" != "${PY_BASE}" ]; then
            echo "::error file=emotion_spirit/_version.py::__version__ '${PY_VERSION}' (base '${PY_BASE}') does not match git tag base '${TAG_BASE}' (tag='${TAG_VERSION}')"
            exit 1
          fi

          echo "✓ All three version sources consistent (base): ${TAG_BASE}"

      - name: Build release zip via git archive
        run: |
          # --prefix=astrbot_plugin_emotion_spirit/ → zip 内顶层是 astrbot_plugin_emotion_spirit/ 文件夹
          # --format=zip → 直接生成 zip
          # export-ignore 规则由 .gitattributes 提供
          git archive \
            --prefix=astrbot_plugin_emotion_spirit/ \
            --format=zip \
            -o "${{ steps.version.outputs.ZIP_NAME }}" \
            HEAD
          echo "---"
          echo "Zip size:"
          ls -lh "${{ steps.version.outputs.ZIP_NAME }}"

      - name: Verify zip contents
        run: |
          echo "=== Top-level entries (should start with astrbot_plugin_emotion_spirit/) ==="
          unzip -l "${{ steps.version.outputs.ZIP_NAME }}" | head -10
          echo "..."
          echo ""
          echo "=== Total file count ==="
          unzip -l "${{ steps.version.outputs.ZIP_NAME }}" | tail -1
          echo ""
          echo "=== Sanity checks ==="
          # 必须包含的文件
          unzip -l "${{ steps.version.outputs.ZIP_NAME }}" | grep -q "astrbot_plugin_emotion_spirit/main.py" && echo "  ✓ main.py present" || (echo "  ✗ main.py MISSING" && exit 1)
          unzip -l "${{ steps.version.outputs.ZIP_NAME }}" | grep -q "astrbot_plugin_emotion_spirit/metadata.yaml" && echo "  ✓ metadata.yaml present" || (echo "  ✗ metadata.yaml MISSING" && exit 1)
          unzip -l "${{ steps.version.outputs.ZIP_NAME }}" | grep -q "astrbot_plugin_emotion_spirit/emotion_spirit/__init__.py" && echo "  ✓ emotion_spirit package present" || (echo "  ✗ emotion_spirit package MISSING" && exit 1)
          # data/cmd_config.json 是 AstrBot 平台级运行时配置(含 admin 密码/白名单),
          # 由 WebUI 生成写入 <astrbot_data>/cmd_config.json,不属于插件 release。
          # release zip 必须确保它不在(否则用户解压会覆盖自己实例的真实配置 + 泄漏模板密码)。
          unzip -l "${{ steps.version.outputs.ZIP_NAME }}" | grep -q "astrbot_plugin_emotion_spirit/data/cmd_config.json" && (echo "  ✗ data/cmd_config.json should NOT be in release (AstrBot runtime config, may carry secrets)" && exit 1) || echo "  ✓ data/cmd_config.json excluded (AstrBot runtime config, not plugin asset)"
          # 不应包含的文件
          unzip -l "${{ steps.version.outputs.ZIP_NAME }}" | grep -q "astrbot_plugin_emotion_spirit/tests/" && (echo "  ✗ tests/ should be excluded" && exit 1) || echo "  ✓ tests/ excluded"
          unzip -l "${{ steps.version.outputs.ZIP_NAME }}" | grep -q "astrbot_plugin_emotion_spirit/verification/" && (echo "  ✗ verification/ should be excluded" && exit 1) || echo "  ✓ verification/ excluded"
          unzip -l "${{ steps.version.outputs.ZIP_NAME }}" | grep -q "astrbot_plugin_emotion_spirit/tools/" && (echo "  ✗ tools/ should be excluded" && exit 1) || echo "  ✓ tools/ excluded"
          unzip -l "${{ steps.version.outputs.ZIP_NAME }}" | grep -q "astrbot_plugin_emotion_spirit/docs/" && (echo "  ✗ docs/ should be excluded" && exit 1) || echo "  ✓ docs/ excluded"
          unzip -l "${{ steps.version.outputs.ZIP_NAME }}" | grep -q "narrative_backtest" && (echo "  ✗ narrative_backtest JSON should be excluded" && exit 1) || echo "  ✓ narrative_backtest JSON excluded"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.ZIP_NAME }}
          files: ${{ steps.version.outputs.ZIP_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
